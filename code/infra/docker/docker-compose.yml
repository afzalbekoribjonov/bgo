# Beshariq Super-App — lokal infratuzilma (development)
# Ishga tushirish:  docker compose -f infra/docker/docker-compose.yml up -d
# To'xtatish:        docker compose -f infra/docker/docker-compose.yml down
#
# !!!!! DIQQAT !!!!!
# "down -v" YOZMANG — bu barcha ma'lumotni o'chiradi!
# Faqat "down" (volumes'siz) ishlatish xavfsiz.
# Zaxira olish: code/infra/scripts/backup.ps1
#
# Eslatma: prod uchun Neon bepul PostgreSQL tavsiya etiladi (code/infra/scripts/neon-setup.md).

name: beshariq-infra

services:
  # --- PostgreSQL + PostGIS (asosiy tranzaksion + geo DB) ---
  postgres:
    image: postgis/postgis:16-3.4
    container_name: beshariq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beshariq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beshariq_dev_password}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Birinchi ishga tushganda DB'larni yaratadi (database-per-service)
      - ./../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beshariq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- OSRM (marshrut + yo'lga yopishtirish — O'zbekiston, self-hosted) ---
  # Ma'lumot tayyorlash: infra/osrm/build-osrm.sh (bir martalik, infra/osrm/README.md).
  # Umumiy demo serverdan farqli — cheklovsiz, jonli GPS oqimi (har necha soniyada
  # /nearest) uchun yaroqli.
  osrm:
    image: osrm/osrm-backend
    container_name: beshariq-osrm
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/uzbekistan-latest.osrm"]
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./../osrm/data:/data:ro
    # Eslatma: osrm-backend image'da wget/curl yo'q — healthcheck qo'shilmadi.
    # Ishlab turganini tekshirish: curl http://localhost:5000/nearest/v1/driving/70.6,40.4

volumes:
  postgres_data:
