app = "beshariq-order"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    SERVICE = "order"

[env]
  NODE_ENV = "production"
  ORDER_PORT = "4004"
  AUTH_SERVICE_URL = "http://beshariq-auth.flycast"
  MARKET_SERVICE_URL = "http://beshariq-market.flycast"
  RESTAURANT_SERVICE_URL = "http://beshariq-restaurant.flycast"
  OSRM_URL = "http://beshariq-osrm.flycast"
  PAYMENTS_ONLINE_ENABLED = "false"

[http_service]
  internal_port = 4004
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
