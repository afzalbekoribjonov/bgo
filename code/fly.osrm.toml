app = "beshariq-osrm"
primary_region = "fra"

[build]
  image = "osrm/osrm-backend"

[processes]
  app = "osrm-routed --algorithm mld /data/uzbekistan-latest.osrm"

[mounts]
  source = "osrm_data"
  destination = "/data"

[[services]]
  internal_port = 5000
  protocol = "tcp"
  processes = ["app"]
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
